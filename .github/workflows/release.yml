# master 에 머지되면 릴리스가 나간다. 기여자가 버전을 신경 쓸 필요는 없다.
#
#  - PR 에서 manifest 버전을 직접 올렸으면 그 버전으로 낸다 (minor/major 를 쓰고 싶을 때)
#  - 안 올렸으면 워크플로가 패치 버전을 올려 커밋해 두고 그 버전으로 낸다
#
# 되밀어 넣는 커밋에는 [skip ci] 가 붙어서 자기 자신을 다시 부르지 않는다.
name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 낼 버전 정하기
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          if [ "$MANIFEST" != "$PACKAGE" ]; then
            echo "::error::manifest.json($MANIFEST) 과 package.json($PACKAGE) 의 버전이 다릅니다."
            exit 1
          fi

          if gh release view "v$MANIFEST" >/dev/null 2>&1; then
            # 이미 나간 버전이다. 이번 머지 몫으로 패치를 올린다.
            VERSION=$(node -p "
              const p='$MANIFEST'.split('.').map(Number);
              while (p.length < 3) p.push(0);
              p[2] += 1;
              p.join('.');
            ")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "v$MANIFEST 는 이미 나갔습니다. v$VERSION 으로 올립니다."
          else
            VERSION="$MANIFEST"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "PR 에서 올린 v$VERSION 을 그대로 씁니다."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 의존성이 없는 프로젝트라 설치 단계가 없다.
      - name: Test
        run: npm test

      - name: 올린 버전을 master 에 되돌려 놓기
        if: steps.ver.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            for (const f of ["manifest.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          '
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json
          git commit -m "Bump version to $VERSION [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package
        run: npm run package

      - name: ZIP 검증
        run: |
          set -euo pipefail
          unzip -tq dist/amaranth-worktime-extension.zip
          # 런타임 파일만 들어 있어야 한다. 테스트·문서·개발 스크립트가 섞이면 실패.
          if unzip -Z1 dist/amaranth-worktime-extension.zip \
            | grep -Ev '^(manifest\.json|[^/]+\.(js|html|css)|(lib|fonts|icons)/.+)$'; then
            echo "::error::배포에 들어가면 안 되는 파일이 있습니다."
            exit 1
          fi
          unzip -Z1 dist/amaranth-worktime-extension.zip | wc -l

      - name: Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="release-notes/${TAG}.md"
          # --target 을 주면 태그도 그 커밋에 맞춰 함께 만들어진다.
          TARGET="${sha:-$GITHUB_SHA}"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/amaranth-worktime-extension.zip \
              --target "$TARGET" --title "Amaranth Worktime $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/amaranth-worktime-extension.zip \
              --target "$TARGET" --title "Amaranth Worktime $TAG" --generate-notes
          fi
