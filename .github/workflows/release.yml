# v* 태그를 밀면 테스트 → 패키징 → 릴리스 발행까지 여기서 끝난다.
# 로컬 계정이 무엇이든 상관없다. GITHUB_TOKEN 으로 저장소가 스스로 올린다.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 의존성이 없는 프로젝트라 설치 단계가 없다.
      - name: Test
        run: npm test

      - name: 태그와 manifest 버전이 같은지 확인
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PACKAGE"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::태그와 manifest.json / package.json 의 버전이 다릅니다."
            exit 1
          fi

      - name: Package
        run: npm run package

      - name: ZIP 검증
        run: |
          unzip -tq dist/amaranth-worktime-extension.zip
          # 런타임 파일만 들어 있어야 한다. 테스트·문서·개발 스크립트가 섞이면 실패.
          if unzip -Z1 dist/amaranth-worktime-extension.zip \
            | grep -Ev '^(manifest\.json|[^/]+\.(js|html|css)|(lib|fonts|icons)/.+)$'; then
            echo "::error::배포에 들어가면 안 되는 파일이 있습니다."
            exit 1
          fi
          unzip -Z1 dist/amaranth-worktime-extension.zip | wc -l

      - name: Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" dist/amaranth-worktime-extension.zip \
              --title "Amaranth Worktime $GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" dist/amaranth-worktime-extension.zip \
              --title "Amaranth Worktime $GITHUB_REF_NAME" --generate-notes
          fi
