<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gw-worktime 업데이트</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="update-page">
  <main class="update-main">
    <h1 id="title">폴더 설정</h1>
    <p>chrome://extensions에서 로드한 설치 폴더를 선택해 주세요. 선택한 폴더는 다음 업데이트에도 기억합니다.</p>
    <p id="folder">저장된 폴더를 확인하는 중…</p>
    <div class="ver-actions">
      <button id="choose" class="btn" disabled>설치 폴더 선택</button>
      <button id="install" class="btn" disabled hidden>업데이트 적용</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">최신 공개 릴리스의 파일로 교체합니다. 작업이 끝나면 확장이 다시 로드됩니다. 업데이트 중에는 이 탭과 브라우저를 닫지 마세요.</p>
  </main>
  <script type="module" src="update.js"></script>
</body>
</html>
